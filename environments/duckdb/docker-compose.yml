name: hdh-duckdb

# ---------------------------------------------------------------------------
# Môi trường 1 — NHẸ:  CSV -> DuckDB (bronze + silver + gold) trong 1 container.
#   Không MinIO, không Iceberg, không Trino, không Spark. Toàn bộ pipeline chạy
#   bằng dbt-duckdb: bronze đọc thẳng CSV, silver/gold transform ngay trong file .duckdb.
#
# Chạy (từ thư mục gốc repo):
#   make duckdb-up      # build image + bật container
#   make duckdb-run     # dbt build --target duckdb (bronze -> silver -> gold + test)
#   make duckdb-query   # xem thử 1 bảng gold
#
# Đường dẫn tương đối tính từ gốc repo vì Makefile chạy với --project-directory .
# ---------------------------------------------------------------------------

services:
  dbt:
    build:
      context: ./dbt
    image: hdh-dbt:local          # cùng image với stack spark-trino (đã có sẵn 2 adapter)
    container_name: hdh-duckdb-dbt
    volumes:
      - ./dbt/hdh_dbt:/usr/app/hdh_dbt        # code dbt (models/macros)
      - ./dbt/profiles.yml:/root/.dbt/profiles.yml:ro
      - ./data:/data:ro                       # CSV nguồn -> var data_dir=/data
      - duckdb-warehouse:/warehouse           # file hdh.duckdb sống ở đây (giữ giữa các lần chạy)
    working_dir: /usr/app/hdh_dbt
    # Giữ container sống để exec `dbt build` vào
    command: ["tail", "-f", "/dev/null"]

volumes:
  duckdb-warehouse:
