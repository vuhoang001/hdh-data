version: 2

models:
  - name: silver_customers
    description: "Khách hàng đã làm sạch (silver layer)"
    columns:
      - name: customer_id
        description: "Khoá chính"
        data_tests:
          - not_null
          - unique

      - name: zip
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_geography')
                field: zip

      - name: gender
        data_tests:
          - accepted_values:
              arguments:
                values: ["female", "male", "non-binary"]

      - name: age_group
        data_tests:
          - accepted_values:
              arguments:
                values: ["18-24", "25-34", "35-44", "45-54", "55+"]

      - name: acquisition_channel
        data_tests:
          - accepted_values:
              arguments:
                values: ["direct", "email_campaign", "organic_search", "paid_search", "referral", "social_media"]

      - name: signup_date
        data_tests:
          - not_null
          # GENERIC TEST TỰ VIẾT (tests/generic/not_future_date.sql)
          - not_future_date
