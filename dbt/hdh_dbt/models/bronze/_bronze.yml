version: 2

# Bronze layer cho môi trường DuckDB: đọc thẳng CSV, chuẩn hoá text, gắn cờ _is_valid +
# audit, GIỮ NGUYÊN số dòng nguồn. Làm đúng việc các job Spark làm ở môi trường Trino.
#
# Các model này chỉ build khi target = duckdb (khai báo enabled ở dbt_project.yml). Ở target
# trino, bronze do Spark ghi vào Iceberg và dbt đọc qua source('bronze', ...) — xem
# models/silver/_sources.yml. Các test khoá chính dưới đây phản chiếu test của source đó,
# nên hai môi trường được kiểm chất lượng như nhau.

models:
  - name: bronze_orders
    description: "Đơn hàng bronze: text đã chuẩn hoá, có cờ chất lượng, giữ nguyên số dòng nguồn"
    columns:
      - name: order_id
        tests: [not_null, unique]

  - name: bronze_order_items
    description: "Dòng hàng bronze: giữ nguyên số dòng nguồn, có cờ chất lượng"
    columns:
      - name: order_id
        tests: [not_null]
      - name: product_id
        tests: [not_null]

  - name: bronze_customers
    description: "Khách hàng bronze. customer_id là khoá chính (121.930/121.930 unique)"
    columns:
      - name: customer_id
        tests: [not_null, unique]
      - name: zip
        tests: [not_null]

  - name: bronze_geography
    description: "Tra cứu zip -> city/region/district. zip là khoá chính (39.948 unique)"
    columns:
      - name: zip
        tests: [not_null, unique]

  - name: bronze_products
    description: "Sản phẩm bronze. price là giá NIÊM YẾT HIỆN TẠI, không phải giá bán lịch sử"
    columns:
      - name: product_id
        tests: [not_null, unique]

  - name: bronze_promotions
    description: "Khuyến mãi. applicable_category NULL = áp dụng mọi category"
    columns:
      - name: promo_id
        tests: [not_null, unique]

  - name: bronze_payments
    description: "Thanh toán bronze (1 đơn 1 dòng). Chưa có downstream, giữ để phân tích/parity"
  - name: bronze_shipments
    description: "Vận chuyển bronze. Chưa có downstream, giữ để phân tích/parity"
  - name: bronze_returns
    description: "Trả hàng bronze. Chưa có downstream, giữ để phân tích/parity"
  - name: bronze_reviews
    description: "Đánh giá bronze. Chưa có downstream, giữ để phân tích/parity"
  - name: bronze_inventory
    description: "Snapshot tồn kho theo tháng. Chưa có downstream, giữ để phân tích/parity"
  - name: bronze_sales_daily
    description: "Doanh thu ngày tổng hợp sẵn (độc lập order_items). Cột _margin_negative đánh dấu ngày bán lỗ"
  - name: bronze_web_traffic
    description: "Lưu lượng web theo ngày. Chưa có downstream, giữ để phân tích/parity"
