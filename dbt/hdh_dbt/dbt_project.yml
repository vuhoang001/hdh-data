name: hdh_dbt
version: "1.0.0"
config-version: 2

profile: hdh_dbt

model-paths: ["models"]
seed-paths: ["seeds"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Thư mục chứa CSV nguồn, nhìn từ bên trong container. Chỉ dùng ở target duckdb (bronze đọc
# CSV trực tiếp). Ở target trino, bronze do Spark ghi Iceberg nên var này không được dùng.
vars:
  data_dir: "/data"

models:
  hdh_dbt:
    # bronze: CHỈ build ở target duckdb (đọc CSV, làm việc của Spark). Ở target trino, bronze
    #   do Spark ghi Iceberg và dbt đọc qua source -> tắt để dbt không cố build lại.
    # silver -> view (chỉ lọc/đổi tên, rẻ), gold -> table (group by/join đắt, tính 1 lần).
    bronze:
      +enabled: "{{ target.type == 'duckdb' }}"
      +materialized: table
      +schema: bronze
    silver:
      +materialized: view
    gold:
      +materialized: table
