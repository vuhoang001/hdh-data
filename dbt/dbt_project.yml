name: hdh_dbt
version: "1.0.0"
config-version: 2

profile: hdh_dbt

# Tạo sẵn namespace silver + gold trước mỗi lần build. dbt tự tạo schema đích không ổn
# định trên catalog Iceberg REST (bỏ sót silver ở lần build sạch) — xem macro để biết chi
# tiết. Chạy được ở cả target dev (DuckDB) lẫn prod (Trino), không rẽ nhánh môi trường.
on-run-start:
  - "{{ ensure_layer_schemas() }}"

model-paths: ["models"]
seed-paths: ["seeds"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# =============================================================================
# MỘT bộ model, HAI execution engine.
#
#   dbt build --target dev    -> DuckDB ──► Iceberg ──► MinIO
#   dbt build --target prod   -> Trino  ──► Iceberg ──► MinIO
#
# KHÔNG có `enabled` nào phụ thuộc target ở đây nữa. Trước đây tầng bronze chỉ build ở
# duckdb (`+enabled: target.type == 'duckdb'`) còn source bronze chỉ bật ở trino — tức
# hai môi trường có hai đồ thị model khác nhau. Giờ bronze do tầng ingestion ghi vào
# Iceberg ở CẢ HAI môi trường, nên dbt luôn đọc nó qua source() và đồ thị model giống
# hệt nhau. Xem models/_sources.yml.
#
# Đặc tả bronze SQL nằm ở ingestion/bronze_specs/ (KHÔNG phải trong dbt project): chúng
# không phải dbt model mà là đặc tả ingestion, do ingestion/engines/* chạy để ghi bronze
# vào Iceberg. dbt chỉ ĐỌC bronze qua source() — xem models/_sources.yml.
#
# Thư mục model theo quy ước dbt kinh điển: staging (tầng silver) -> marts (tầng gold).
# =============================================================================
models:
  hdh_dbt:
    # staging = tầng SILVER của medallion: làm sạch, lọc _is_valid, bỏ cột kỹ thuật.
    staging:
      # PHẢI là table, không được là view: DuckDB-Iceberg chưa hỗ trợ CREATE VIEW
      # (báo thẳng "Not implemented Error: Create View"). Chọn table cho CẢ HAI môi
      # trường thay vì view-ở-Trino/table-ở-DuckDB, vì materialization khác nhau kéo
      # theo hành vi khác nhau và làm hỏng mục tiêu "hai env cho cùng kết quả".
      # Đánh đổi: tốn thêm dung lượng, và silver không còn tự động phản ánh bronze mới
      # nhất mà phải build lại — nhưng `dbt build` vốn đã luôn chạy cả chuỗi.
      +materialized: table
      # NAMESPACE Iceberg vẫn là silver (SILVER_NAMESPACE) — chỉ thư mục dbt đổi tên.
      +schema: "{{ env_var('SILVER_NAMESPACE', 'silver') }}"
    # marts = tầng GOLD của medallion: star schema, bảng business-facing.
    marts:
      +materialized: table
      +schema: "{{ env_var('GOLD_NAMESPACE', 'gold') }}"

# =============================================================================
# CẤU HÌNH TEST THEO TẦNG
#
# Cùng một test (not_null) mang ý nghĩa khác nhau tuỳ tầng, nên severity phải khác nhau
# — đặt một chỗ ở đây thay vì lặp `config: severity:` trong từng file YAML.
#
#   silver -> error: silver đã lọc _is_valid, không còn lý do gì để bẩn nữa.
#   gold   -> error: gold là thứ người dùng đọc. Thà không có báo cáo còn hơn báo cáo sai.
#
# Test của tầng bronze là SOURCE TEST nên không cấu hình được theo đường dẫn model —
# severity của chúng khai tường minh trong models/_sources.yml (đều là `warn`, vì bronze
# có nhiệm vụ phản ánh trung thực nguồn kể cả khi nguồn bẩn).
#
# store_failures: ghi các dòng fail ra bảng thay vì chỉ đếm trong log, để mở lên xem
# được đúng dòng nào sai. Bật theo từng test khi cần (xem marts/fact_order_items.yml).
# Bảng kết quả nằm ở schema <schema>_dbt_test__audit.
# =============================================================================
data_tests:
  hdh_dbt:
    +severity: error
