# Trino catalog -> Iceberg REST catalog + MinIO (S3).
# ${ENV:VAR} là cú pháp nội suy sẵn có của Trino; biến đến từ .env qua docker compose.
# ĐỪNG hardcode endpoint/bucket ở đây. Sửa .env.
#
# LƯU Ý: TÊN FILE quyết định tên catalog trong Trino (iceberg.properties -> catalog "iceberg").
# Đổi ICEBERG_CATALOG_NAME trong .env thì phải đổi tên file này cho khớp.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=${ENV:ICEBERG_REST_URI}
iceberg.rest-catalog.warehouse=s3://${ENV:WAREHOUSE_BUCKET}/

# Truy cập MinIO qua S3 native filesystem của Trino
fs.native-s3.enabled=true
s3.endpoint=${ENV:S3_ENDPOINT}
s3.region=${ENV:AWS_REGION}
s3.path-style-access=true
s3.aws-access-key=${ENV:AWS_ACCESS_KEY_ID}
s3.aws-secret-key=${ENV:AWS_SECRET_ACCESS_KEY}
