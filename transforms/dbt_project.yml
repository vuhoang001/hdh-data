name: hdh_dbt
version: "1.0.0"
config-version: 2

# Kết nối nằm ở config/dbt/profiles.yml (compose mount vào /root/.dbt/profiles.yml)
profile: hdh_dbt

model-paths: ["models"]
seed-paths: ["seeds"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Thư mục chứa CSV nguồn, nhìn từ bên trong container. Giá trị đến từ .env (DBT_DATA_DIR).
  # Chỉ dùng ở target duckdb (bronze đọc CSV trực tiếp). Ở target trino, bronze do Spark ghi
  # Iceberg nên var này không được dùng.
  # Fallback ../data là đường dẫn trên host (dbt chạy với cwd = transforms/), chỉ dùng khi
  # chạy dbt ngoài container vì /data không tồn tại trên host.
  data_dir: "{{ env_var('DBT_DATA_DIR', '../data') }}"

models:
  hdh_dbt:
    # bronze: CHỈ build ở target duckdb (đọc CSV, làm việc của Spark). Ở target trino, bronze
    #   do Spark ghi Iceberg và dbt đọc qua source -> tắt để dbt không cố build lại.
    # silver -> view (chỉ lọc/đổi tên, rẻ), gold -> table (group by/join đắt, tính 1 lần).
    bronze:
      +enabled: "{{ target.type == 'duckdb' }}"
      +materialized: table
      # Cùng tên namespace Spark ghi vào ở môi trường lakehouse -> query giống nhau ở cả hai
      +schema: "{{ env_var('BRONZE_NAMESPACE', 'bronze') }}"
    silver:
      +materialized: view
    gold:
      +materialized: table

# =============================================================================
# CẤU HÌNH TEST THEO TẦNG
#
# Cùng một test (not_null) mang ý nghĩa khác nhau tuỳ tầng nó đứng, nên severity phải
# khác nhau — và đặt ở đây một chỗ thay vì lặp `config: severity:` trong từng file YAML.
#
#   bronze -> warn : bronze có nhiệm vụ PHẢN ÁNH TRUNG THỰC nguồn, kể cả khi nguồn bẩn.
#                    Để error thì mỗi lần nguồn lỗi là cả pipeline đứng, và ta mất luôn
#                    khả năng nhìn thấy chính dữ liệu bẩn đó để đi báo bên nguồn.
#   silver -> error: silver đã lọc _is_valid, không còn lý do gì để bẩn nữa.
#   gold   -> error: gold là thứ người dùng đọc. Thà không có báo cáo còn hơn báo cáo sai.
#
# store_failures: ghi các dòng fail ra bảng thay vì chỉ đếm trong log, để mở lên xem được
# ngay đúng dòng nào sai. Bật cho gold vì đó là nơi điều tra tốn thời gian nhất; các tầng
# dưới bật theo từng test khi cần (xem fact_order_items.yml).
# Bảng kết quả nằm ở schema <schema>_dbt_test__audit.
# =============================================================================
data_tests:
  hdh_dbt:
    +severity: error
    bronze:
      +severity: warn

