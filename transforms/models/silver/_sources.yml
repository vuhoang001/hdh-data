version: 2

sources:
  - name: bronze
    # Catalog + namespace lấy từ .env để không lệch với cấu hình Spark/Trino
    database: "{{ env_var('ICEBERG_CATALOG_NAME', 'iceberg') }}"
    schema: "{{ env_var('BRONZE_NAMESPACE', 'bronze') }}"
    # Source này CHỈ tồn tại ở môi trường Trino (Spark ghi Iceberg). Ở môi trường DuckDB,
    # bronze là các dbt model đọc CSV (models/bronze/) nên tắt source ở đây — nếu để bật,
    # dbt sẽ chạy các test source lên bảng iceberg.bronze không tồn tại và báo lỗi.
    # =================================================================================
    # SOURCE FRESHNESS — chiều TIMELINESS, loại kiểm tra duy nhất không phải là "test"
    #
    # Chạy bằng lệnh RIÊNG, không nằm trong `dbt test`:
    #     dbt source freshness --target trino
    #
    # Nó không đọc nội dung dữ liệu mà chỉ hỏi một câu: max(_ingested_at) cách bây giờ
    # bao lâu? Đây là thứ DUY NHẤT phát hiện được "job ingest chết âm thầm" — khi Spark
    # ngừng chạy, mọi test khác vẫn xanh mướt vì dữ liệu cũ hoàn toàn hợp lệ, chỉ là
    # không còn dữ liệu mới. Không có freshness thì lỗi này chỉ lộ ra khi có người dùng
    # hỏi "sao báo cáo tuần này giống hệt tuần trước".
    #
    # _ingested_at do ingestion/common/iceberg.py gắn vào mọi bảng bronze.
    #
    # Ngưỡng đặt ở mức source, các bảng con thừa kế. Bảng nào có nhịp cập nhật khác thì
    # ghi đè riêng (xem promotions bên dưới).
    #
    # CHÚ Ý: chỉ chạy được ở target trino. Ở duckdb source đang tắt (enabled ở trên).
    # =================================================================================
    config:
      enabled: "{{ target.type != 'duckdb' }}"
      loaded_at_field: _ingested_at
      freshness:
        warn_after: { count: 24, period: hour }
        error_after: { count: 72, period: hour }

    tables:
      - name: orders
        description: "Đơn hàng Bronze: text đã chuẩn hoá, giữ nguyên số dòng nguồn, có cờ chất lượng"
        columns:
          - name: order_id
            data_tests: [not_null, unique]

      - name: order_items
        description: "Dòng hàng bronze: Giữ nguyên số dòng nguồn, có cờ chất lượng"
        columns:
          - name: order_id
            data_tests:
              - not_null
          - name: product_id
            data_tests:
              - not_null

      - name: customers
        description: "Khách hàng Bronze. customer_id là khoá chính (121.930/121.930 unique)"
        columns:
          - name: customer_id
            data_tests: [not_null, unique]
          - name: zip
            data_tests: [not_null]

      - name: geography
        description: "Tra cứu zip -> city/region/district. zip là khoá chính (39.948 unique)"
        # Bảng tra cứu địa lý gần như không đổi — ngưỡng 24h của source sẽ báo vàng mỗi
        # ngày mà không có gì sai. Nới ra 1 tuần: ghi đè freshness ở mức bảng.
        config:
          freshness:
            warn_after: { count: 7, period: day }
            error_after: { count: 30, period: day }
        columns:
          - name: zip
            data_tests: [not_null, unique]

      - name: products
        description: "Sản phẩm Bronze. LƯU Ý: price là giá NIÊM YẾT HIỆN TẠI, không phải giá bán lịch sử"
        config:
          freshness:
            warn_after: { count: 7, period: day }
            error_after: { count: 30, period: day }
        columns:
          - name: product_id
            data_tests: [not_null, unique]

      - name: promotions
        description: "Chương trình khuyến mãi. applicable_category NULL = áp dụng mọi category"
        config:
          freshness:
            warn_after: { count: 7, period: day }
            error_after: { count: 30, period: day }
        columns:
          - name: promo_id
            data_tests: [not_null, unique]
