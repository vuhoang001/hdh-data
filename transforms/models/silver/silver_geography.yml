version: 2

models:
  - name: silver_geography
    description: "Tra cứu địa lý theo zip (silver layer)"
    columns:
      - name: zip
        description: "Khoá chính — mỗi zip đúng 1 dòng"
        data_tests:
          - not_null
          - unique

      - name: city
        data_tests:
          - not_null
          - dbt_utils.not_constant

      - name: region
        data_tests:
          - accepted_values:
              arguments:
                values: ["central", "east", "west"]
          # Cả 3 vùng phải cùng tồn tại. accepted_values vẫn pass nếu 100% zip rơi vào
          # 'east' do lỗi map vùng — không_constant thì không.
          - dbt_utils.not_constant

      - name: district
        data_tests:
          - not_null
